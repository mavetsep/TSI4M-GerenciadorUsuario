spring.application.name=GerenciadorUsuario
server.port=${PORT:8081}

# H2 em arquivo: funciona imediatamente no Codespaces e preserva os dados enquanto o Codespace existir.
spring.datasource.url=jdbc:h2:file:./data/usuarios;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
